          - { name: "errEmail", label: "Please enter a valid email address.", widget: string, i18n: true }
          - { name: "errDates", label: "Departure must be after arrival.", widget: string, i18n: true }
          - { name: "privacy", label: "Your details are used only to answer this inquiry.", widget: string, i18n: true }
