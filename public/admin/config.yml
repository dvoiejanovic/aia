            fields:
              - { name: "from", label: "From", widget: string, i18n: true }
              - { name: "text", label: "Directions", widget: text, i18n: true }
          - { name: "metaDesc", label: "Description for Google", widget: text, i18n: true, hint: "Shown in search results. About 150 characters." }
      - name: "form"
        label: "Inquiry form"
        file: src/content/text/{{locale}}/form.json
        i18n: true
        fields:
          - { name: "title", label: "Send an inquiry", widget: string, i18n: true }
          - { name: "intro", label: "Tell us your dates and we will reply with availability an…", widget: text, i18n: true }
          - { name: "name", label: "Your name", widget: string, i18n: true }
          - { name: "email", label: "Email", widget: string, i18n: true }
          - { name: "phone", label: "Phone / WhatsApp", widget: string, i18n: true }
          - { name: "optional", label: "optional", widget: string, i18n: true }
          - { name: "apartment", label: "Apartment", widget: string, i18n: true }
