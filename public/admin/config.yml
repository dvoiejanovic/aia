        i18n: true
        fields:
          - { name: "tagline", label: "Tagline (under the name)", widget: string, i18n: true }
          - { name: "summary", label: "Short summary", widget: text, i18n: true }
          - { name: "body", label: "Description", widget: text, i18n: true, hint: "Leave an empty line between paragraphs." }
          - { name: "goodToKnow", label: "Good to know", widget: text, i18n: true, hint: "One item per line." }
          - { name: "metaDesc", label: "Description for Google", widget: text, i18n: true, hint: "Shown in search results. About 150 characters." }
      - name: "pag"
        label: "Island Pag"
        file: src/content/text/{{locale}}/pag.json
        i18n: true
        fields:
          - { name: "title", label: "Title", widget: string, i18n: true }
          - { name: "tagline", label: "Tagline", widget: string, i18n: true }
          - { name: "body", label: "About the island", widget: text, i18n: true, hint: "Leave an empty line between paragraphs." }
          - name: "nearby"
            label: "Nearby"
            widget: list
            i18n: true
            summary: "{{place}}"
            fields:
              - { name: "place", label: "Place", widget: string, i18n: true }
              - { name: "distance", label: "Distance", widget: string, i18n: true }
          - { name: "directionsIntro", label: "Getting there: introduction", widget: text, i18n: true }
          - name: "directions"
            label: "Getting there: routes"
            widget: list
            i18n: true
            summary: "{{from}}"
            fields:
              - { name: "from", label: "From", widget: string, i18n: true }
              - { name: "text", label: "Directions", widget: text, i18n: true }
          - { name: "metaDesc", label: "Description for Google", widget: text, i18n: true, hint: "Shown in search results. About 150 characters." }
      - name: "cres"
        label: "Island Cres"
        file: src/content/text/{{locale}}/cres.json
        i18n: true
        fields:
