# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Admin page settings (Sveltia CMS). Each entry below is a form that edits one file in src/content/.

backend:
  name: github
  repo: dvoiejanovic/aia
  branch: main

# Not used yet: where the admin would store uploaded files.
media_folder: /public/uploads
public_folder: /uploads

i18n:
  locales: [en, hr, de, it]
  default_locale: en

collections:
  - name: prices
    label: Prices
    icon: euro
    files:
      - name: prices
        label: Prices and fees
        file: src/content/prices.json
        fields:
          - { name: year, label: "Price list year", widget: number, value_type: int, min: 2025 }
          - name: fees
            label: Fees
            widget: object
            fields:
              - { name: cleaning, label: "Cleaning fee (€)", widget: number, value_type: int, min: 0 }
              - { name: petPerNight, label: "Small pet, per night (€)", widget: number, value_type: int, min: 0 }
              - { name: shortStayPercent, label: "Extra charge for stays of 2 or 3 nights (%)", widget: number, value_type: int, min: 0 }
          - name: apartments
            label: Apartments
            widget: object
            fields:
              - name: "rino"
                label: "Apartment Rino"
                widget: object
                fields:
                  - name: seasons
                    label: Seasons
                    widget: list
                    summary: "€{{price}} per night"
                    fields:
                      - { name: price, label: "Price per night (€)", widget: number, value_type: int, min: 0 }
                      - name: periods
                        label: Periods
                        widget: list
                        summary: "{{from}} – {{to}}"
                        fields:
                          - { name: from, label: "From (DD.MM.)", widget: string, pattern: ['^\d{2}\.\d{2}\.$', 'Write the date as DD.MM. for example 05.06.'] }
                          - { name: to, label: "To (DD.MM.)", widget: string, pattern: ['^\d{2}\.\d{2}\.$', 'Write the date as DD.MM. for example 26.06.'] }
              - name: "punta-blue"
                label: "Apartment Punta Blue"
                widget: object
                fields:
                  - name: seasons
                    label: Seasons
                    widget: list
                    summary: "€{{price}} per night"
                    fields:
                      - { name: price, label: "Price per night (€)", widget: number, value_type: int, min: 0 }
                      - name: periods
                        label: Periods
                        widget: list
                        summary: "{{from}} – {{to}}"
                        fields:
                          - { name: from, label: "From (DD.MM.)", widget: string, pattern: ['^\d{2}\.\d{2}\.$', 'Write the date as DD.MM. for example 05.06.'] }
                          - { name: to, label: "To (DD.MM.)", widget: string, pattern: ['^\d{2}\.\d{2}\.$', 'Write the date as DD.MM. for example 26.06.'] }
              - name: "punta-orange"
                label: "Apartment Punta Orange"
                widget: object
                fields:
                  - name: seasons
                    label: Seasons
                    widget: list
                    summary: "€{{price}} per night"
                    fields:
                      - { name: price, label: "Price per night (€)", widget: number, value_type: int, min: 0 }
                      - name: periods
                        label: Periods
                        widget: list
                        summary: "{{from}} – {{to}}"
                        fields:
                          - { name: from, label: "From (DD.MM.)", widget: string, pattern: ['^\d{2}\.\d{2}\.$', 'Write the date as DD.MM. for example 05.06.'] }
                          - { name: to, label: "To (DD.MM.)", widget: string, pattern: ['^\d{2}\.\d{2}\.$', 'Write the date as DD.MM. for example 26.06.'] }

  - name: text
    label: Texts
    icon: translate
    i18n: true
    files:
      - name: "home"
        label: "Home page"
        file: src/content/text/{{locale}}/home.json
        i18n: true
        fields:
          - { name: "kicker", label: "Small line above the headline", widget: string, i18n: true }
          - { name: "heroTitle", label: "Headline", widget: string, i18n: true }
          - { name: "heroSub", label: "Line under the headline", widget: text, i18n: true }
          - { name: "introTitle", label: "Introduction: title", widget: string, i18n: true }
          - { name: "intro", label: "Introduction: text", widget: text, i18n: true, hint: "Leave an empty line between paragraphs." }
          - { name: "hostTitle", label: "Host: title", widget: string, i18n: true }
          - { name: "host", label: "Host: text", widget: text, i18n: true, hint: "Leave an empty line between paragraphs." }
          - { name: "title", label: "Page title for Google", widget: string, i18n: true }
          - { name: "metaDesc", label: "Description for Google", widget: text, i18n: true, hint: "Shown in search results. About 150 characters." }
      - name: "rino"
        label: "Apartment Rino"
        file: src/content/text/{{locale}}/rino.json
        i18n: true
        fields:
          - { name: "tagline", label: "Tagline (under the name)", widget: string, i18n: true }
          - { name: "summary", label: "Short summary", widget: text, i18n: true }
          - { name: "body", label: "Description", widget: text, i18n: true, hint: "Leave an empty line between paragraphs." }
          - { name: "goodToKnow", label: "Good to know", widget: text, i18n: true, hint: "One item per line." }
          - { name: "metaDesc", label: "Description for Google", widget: text, i18n: true, hint: "Shown in search results. About 150 characters." }
      - name: "punta-blue"
        label: "Apartment Punta Blue"
